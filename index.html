<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Valvakan 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap">
<style>
:root{--ground:#DCD3BA;--paper:#EFE8D6;--ink:#1E1D16;--ink2:#3B392D;--red:#A8261B;--shadow:rgba(30,29,22,.55)}
@media (prefers-color-scheme:dark){:root{--ground:#12130D;--paper:#1C1D15;--ink:#E9E0C6;--ink2:#CFC6AB;--red:#E0563F;--shadow:rgba(0,0,0,.7)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:"Courier Prime","Courier New",monospace;font-size:15px;padding:24px}
form{background:var(--paper);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:28px 26px;width:100%;max-width:380px;display:grid;gap:14px;position:relative}
.stamp{position:absolute;top:-16px;right:-12px;background:var(--paper);font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:800;font-size:20px;letter-spacing:.1em;color:var(--red);border:3px solid var(--red);padding:2px 10px 0;transform:rotate(8deg);opacity:.85;text-transform:uppercase}
h1{margin:0;font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:52px;line-height:.86;text-transform:uppercase}
p{margin:0;color:var(--ink2)}
.lbl{font-family:"Special Elite","Courier New",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
input[type=password]{font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);width:100%}
label.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
button{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 6px;background:var(--ink);color:var(--paper);border:0;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.err{color:var(--red);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="stamp" aria-hidden="true">Hemligt</div>
  <div class="lbl">Lägesrapport · endast behöriga</div>
  <h1>Valvakan<br>2026</h1>
  <p>Ange lösen för att öppna rapporten.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Lösen" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Kom ihåg på den här enheten</label>
  <button id="btn" type="submit">Öppna</button>
  <p class="err" id="err" hidden>Fel lösen. Försök igen.</p>
</form>

const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dekryptera(pw){
  const bas=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(P.s),iterations:P.n,hash:'SHA-256'},bas,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.i)},key,bytes(P.c)));
}
async function oppna(pw,spara){
  try{
    const html=await dekryptera(pw);
    if(spara){try{localStorage.setItem('valvakan-losen',pw);}catch(e){}}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){return false;}
}
const f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='Dekrypterar …';err.hidden=true;
  if(!await oppna(document.getElementById('pw').value,document.getElementById('rem').checked)){
    btn.disabled=false;btn.textContent='Öppna';err.hidden=false;
  }
});
(async()=>{let s=null;try{s=localStorage.getItem('valvakan-losen');}catch(e){}
  if(s&&!await oppna(s,true)){try{localStorage.removeItem('valvakan-losen');}catch(e){}}})();
</script>
